<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340" role="img" aria-labelledby="title desc">
<title id="title">How a book, course or policy is turned into structured files</title><desc id="desc">One source branches to index, chapter, techniques and glossary files.</desc>
<style>:root{--ink:#183b56;--line:#607080;--panel:#f6f8fa;--blue:#dfeaf3;--green:#e8f5ed}@media(prefers-color-scheme:dark){:root{--ink:#e6edf3;--line:#9baabd;--panel:#1f2937;--blue:#23364a;--green:#183b2a}}text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.box{stroke:var(--line);stroke-width:3;rx:16}.line{stroke:var(--line);stroke-width:3;fill:none}.main{font-size:22px;font-weight:700}.sub{font-size:17px;font-weight:700}</style>
<rect class="box" x="270" y="25" width="300" height="70" fill="var(--blue)"/><text class="main" x="420" y="57" text-anchor="middle">Book, course, or policy</text><path class="line" d="M420 95V140M112 140H728M112 140V185M317 140V185M523 140V185M728 140V185"/>
<rect class="box" x="20" y="185" width="184" height="75" fill="var(--panel)"/><rect class="box" x="225" y="185" width="184" height="75" fill="var(--panel)"/><rect class="box" x="431" y="185" width="184" height="75" fill="var(--green)"/><rect class="box" x="636" y="185" width="184" height="75" fill="var(--panel)"/>
<text class="sub" x="112" y="230" text-anchor="middle">Index file</text><text class="sub" x="317" y="220" text-anchor="middle">Chapter files</text><text x="317" y="243" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="var(--ink)" font-size="14">one per chapter</text><text class="sub" x="523" y="220" text-anchor="middle">Techniques</text><text class="sub" x="523" y="243" text-anchor="middle">document</text><text class="sub" x="728" y="230" text-anchor="middle">Glossary</text>
</svg>
